name: Auto Commit

on:
  schedule:
    - cron: '0 0 * * 1,4,6'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make a commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date >> log.txt
          git add log.txt
          git commit -m "chore: auto commit $(date +'%Y-%m-%d')"
          git push
